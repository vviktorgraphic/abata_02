<!doctype html>
<html lang="hu">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../public/assets/css/admin.css"><title>Pricing responsive fixture</title></head>
<body>
<header class="brand-header"><a class="brand" href="#">A Bata</a><nav><a href="#">Foglalások</a><a href="#">Blokkolt időszakok</a><a href="#">Árképzés</a><a href="#">Naptárszinkron</a></nav></header>
<main class="admin-main"><section class="admin-page pricing-page"><p class="eyebrow">Adminisztráció</p><h1>Árképzés</h1><section class="panel"><h2>Felnőttárak</h2><form><div class="field-grid"><label>Hétköznapi ár<input value="20000"></label><label>Hétvégi ár<input value="25000"></label></div><button>Mentés</button></form></section><section class="panel"><h2>Gyermek ársávok</h2><div class="table-scroll" id="table-wrapper"><table class="child-price-table"><thead><tr><th>Kor</th><th>Hétköznap</th><th>Hétvége</th><th>Művelet</th></tr></thead><tbody><tr><td>3–6 év</td><td>5 000 Ft</td><td>6 000 Ft</td><td>Szerkesztés Törlés</td></tr></tbody></table></div></section></section></main>
<script>addEventListener('load',()=>{const root=document.documentElement;const wrapper=document.getElementById('table-wrapper');const table=wrapper.querySelector('table');root.dataset.overflow=String(root.scrollWidth>innerWidth);root.dataset.tableLocalized=String(table.scrollWidth>wrapper.clientWidth);});</script>
</body>
</html>
